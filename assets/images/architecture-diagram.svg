<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill: #f0f8ff; stroke: #4682b4; stroke-width: 2; rx: 5; }
      .azure-box { fill: #e6f3ff; stroke: #0078d4; stroke-width: 2; rx: 5; }
      .hsm-box { fill: #fff2e6; stroke: #ff8c00; stroke-width: 2; rx: 5; }
      .identity-box { fill: #f0fff0; stroke: #32cd32; stroke-width: 2; rx: 5; }
      .benefits-box { fill: #fff5f5; stroke: #dc3545; stroke-width: 2; rx: 5; }
      .features-box { fill: #f8f9fa; stroke: #6c757d; stroke-width: 2; rx: 5; }
      .text { font-family: Arial, sans-serif; font-size: 11px; text-anchor: middle; }
      .title { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .main-title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
      .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); }
      .secure-arrow { stroke: #008000; stroke-width: 3; stroke-dasharray: 5,5; marker-end: url(#arrowhead-secure); }
      .legend-arrow { stroke: #333; stroke-width: 1; marker-end: url(#legend-arrowhead); }
      .legend-secure-arrow { stroke: #008000; stroke-width: 1; stroke-dasharray: 3,3; marker-end: url(#legend-arrowhead-secure); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <marker id="arrowhead-secure" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#008000" />
    </marker>
    <marker id="legend-arrowhead" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#333" />
    </marker>
    <marker id="legend-arrowhead-secure" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#008000" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="800" height="600" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="400" y="25" class="main-title">Application Gateway - Managed HSM Keyless TLS Architecture</text>
  
  <!-- Client -->
  <rect x="30" y="80" width="120" height="70" class="box"/>
  <text x="90" y="105" class="title">Client</text>
  <text x="90" y="125" class="text">Web Browser</text>
  <text x="90" y="140" class="text">Mobile App</text>
  
  <!-- Internet Cloud -->
  <ellipse cx="250" cy="115" rx="70" ry="35" fill="#e0e0e0" stroke="#666" stroke-width="1"/>
  <text x="250" y="120" class="text">Internet</text>
  
  <!-- Application Gateway -->
  <rect x="450" y="60" width="260" height="110" class="azure-box"/>
  <text x="580" y="80" class="title">Azure Application Gateway</text>
  
  <!-- TLS Termination -->
  <rect x="465" y="95" width="100" height="35" class="box"/>
  <text x="515" y="110" class="text">TLS Termination</text>
  <text x="515" y="122" class="text">Load Balancing</text>
  
  <!-- TLS Offload Library -->
  <rect x="580" y="95" width="115" height="35" class="box"/>
  <text x="637" y="110" class="text">TLS Offload Library</text>
  <text x="637" y="122" class="text">(PKCS#11)</text>
  
  <!-- Managed HSM (moved to left side) -->
  <rect x="80" y="250" width="200" height="120" class="hsm-box"/>
  <text x="180" y="275" class="title">Azure Managed HSM</text>
  
  <!-- Private Keys -->
  <rect x="95" y="295" width="80" height="40" class="hsm-box"/>
  <text x="135" y="310" class="text">Private Keys</text>
  <text x="135" y="325" class="text">Certificates</text>
  
  <!-- Crypto Operations -->
  <rect x="185" y="295" width="80" height="40" class="hsm-box"/>
  <text x="225" y="310" class="text">Crypto</text>
  <text x="225" y="325" class="text">Operations</text>
  
  <!-- Backend Servers -->
  <rect x="450" y="380" width="200" height="80" class="azure-box"/>
  <text x="550" y="405" class="title">Backend Servers</text>
  <text x="550" y="425" class="text">Web Applications</text>
  <text x="550" y="440" class="text">Azure Container Apps</text>
  
  <!-- User Managed Identity (moved to bottom left) -->
  <rect x="50" y="480" width="180" height="90" class="identity-box"/>
  <text x="140" y="505" class="title">User Managed Identity</text>
  <text x="140" y="525" class="text">Assigned to App Gateway</text>
  <text x="140" y="540" class="text">HSM Authentication</text>
  <text x="140" y="555" class="text">No Shared Secrets</text>
  
  <!-- Client to Internet Arrow -->
  <line x1="150" y1="115" x2="180" y2="115" class="arrow"/>
  <text x="165" y="105" class="text">1. TLS Handshake</text>
  
  <!-- Internet to App Gateway Arrow -->
  <line x1="320" y1="115" x2="450" y2="115" class="arrow"/>
  
  <!-- TLS Termination to TLS Offload Arrow -->
  <line x1="565" y1="112" x2="580" y2="112" class="arrow"/>
  
  <!-- App Gateway to Managed HSM (Direct Connection) -->
  <line x1="515" y1="170" x2="255" y2="250" class="secure-arrow"/>
  <text x="385" y="210" class="text" fill="#008000">3. Crypto Ops</text>
  <text x="385" y="225" class="text" fill="#008000">(PKCS#11 API)</text>
  
  <!-- User Managed Identity to Managed HSM Authentication -->
  <line x1="140" y1="480" x2="180" y2="370" class="secure-arrow"/>
  <text x="120" y="425" class="text" fill="#008000">2. Identity Auth</text>
  
  <!-- App Gateway to Backend (Direct Connection) -->
  <line x1="550" y1="170" x2="550" y2="380" class="arrow"/>
  <text x="575" y="275" class="text">4. Forwarding</text>
  <text x="575" y="290" class="text">(Encrypted Traffic)</text>
  
  <!-- Security Benefits Box -->
  <rect x="660" y="200" width="130" height="140" class="benefits-box"/>
  <text x="725" y="220" class="title">Security Benefits</text>
  <text x="725" y="240" class="text">Keys never leave HSM</text>
  <text x="725" y="255" class="text">FIPS 140-2 Level 3</text>
  <text x="725" y="270" class="text">Hardware security</text>
  <text x="725" y="285" class="text">Managed Identity auth</text>
  <text x="725" y="300" class="text">No shared secrets</text>
  <text x="725" y="315" class="text">Audit trails</text>
  <text x="725" y="330" class="text">Compliance ready</text>
  
  <!-- Key Features Box -->
  <rect x="660" y="360" width="130" height="100" class="features-box"/>
  <text x="725" y="380" class="title">Key Features</text>
  <text x="725" y="400" class="text">Keyless TLS</text>
  <text x="725" y="415" class="text">Certificate in ARM</text>
  <text x="725" y="430" class="text">Auto-scaling</text>
  <text x="725" y="445" class="text">Load balancing</text>
  
  <!-- Legend -->
  <rect x="330" y="520" width="140" height="70" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
  <text x="400" y="540" class="title">Legend</text>
  <line x1="345" y1="555" x2="365" y2="555" class="legend-arrow"/>
  <text x="400" y="560" class="text" fill="#333">Standard Flow</text>
  <line x1="345" y1="575" x2="365" y2="575" class="legend-secure-arrow"/>
  <text x="400" y="580" class="text" fill="#008000">Secure/Auth</text>
  
</svg>