<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      .text { font-family: Arial, sans-serif; font-size: 11px; text-anchor: middle; }
      .title { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .main-title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
      .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); }
      .secure-arrow { stroke: #008000; stroke-width: 3; stroke-dasharray: 5,5; marker-end: url(#arrowhead-secure); }
      .legend-arrow { stroke: #333; stroke-width: 1; marker-end: url(#legend-arrowhead); }
      .legend-secure-arrow { stroke: #008000; stroke-width: 1; stroke-dasharray: 3,3; marker-end: url(#legend-arrowhead-secure); }
      .legend-cert-arrow { stroke: #0066cc; stroke-width: 1; marker-end: url(#legend-arrowhead-cert); }
      .cert-arrow { stroke: #0066cc; stroke-width: 2; marker-end: url(#arrowhead-cert); }
      .component-box { fill: #f8f9fa; stroke: #6c757d; stroke-width: 1; rx: 8; }
      .azure-component-box { fill: #e6f3ff; stroke: #0078d4; stroke-width: 1; rx: 8; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <marker id="arrowhead-secure" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#008000" />
    </marker>
    <marker id="legend-arrowhead" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#333" />
    </marker>
    <marker id="legend-arrowhead-secure" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#008000" />
    </marker>
    <marker id="arrowhead-cert" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0066cc" />
    </marker>
    <marker id="legend-arrowhead-cert" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#0066cc" />
    </marker>
    
    <!-- Gradient definitions -->
    <linearGradient id="app-gateway-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5e9624"/>
      <stop offset="50%" stop-color="#6dad2a"/>
      <stop offset="100%" stop-color="#76bc2d"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="800" height="600" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="400" y="25" class="main-title">Application Gateway - Managed HSM Keyless TLS Architecture</text>
  
  <!-- Client -->
  <rect x="30" y="80" width="120" height="70" class="component-box"/>
  <text x="90" y="110" class="title">Client</text>
  <text x="90" y="125" class="text">Web Browser</text>
  <text x="90" y="140" class="text">Mobile App</text>
  
  <!-- Internet Cloud -->
  <ellipse cx="300" cy="115" rx="70" ry="35" fill="#e0e0e0" stroke="#666" stroke-width="1"/>
  <text x="300" y="120" class="text">Internet</text>
  
  <!-- Application Gateway -->
  <rect x="450" y="60" width="260" height="140" class="azure-component-box"/>
  <text x="580" y="85" class="title">Azure Application Gateway</text>
  
  <!-- TLS Termination -->
  <rect x="470" y="95" width="95" height="35" class="component-box"/>
  <text x="517" y="110" class="text">TLS Termination</text>
  <text x="517" y="122" class="text">Load Balancing</text>
  
  <!-- TLS Offload Library -->
  <rect x="575" y="95" width="95" height="35" class="component-box"/>
  <text x="622" y="110" class="text">TLS Offload</text>
  <text x="622" y="122" class="text">(PKCS#11)</text>
  
  <!-- User Managed Identity -->
  <rect x="520" y="140" width="120" height="35" class="component-box"/>
  <text x="580" y="155" class="text">User Managed</text>
  <text x="580" y="167" class="text">Identity</text>
  
  <!-- Managed HSM -->
  <rect x="50" y="320" width="220" height="130" class="azure-component-box"/>
  <text x="160" y="345" class="title">Azure Managed HSM</text>
  
  <!-- Private Keys -->
  <rect x="65" y="360" width="90" height="50" class="component-box"/>
  <text x="110" y="380" class="text">Private Keys</text>
  <text x="110" y="395" class="text">Certificates</text>
  
  <!-- Crypto Operations -->
  <rect x="165" y="360" width="90" height="50" class="component-box"/>
  <text x="210" y="380" class="text">Crypto</text>
  <text x="210" y="395" class="text">Operations</text>
  
  <!-- Linux VM -->
  <rect x="380" y="340" width="140" height="90" class="azure-component-box"/>
  <text x="450" y="365" class="title">Linux VM</text>
  <text x="450" y="385" class="text">Certificate Generation</text>
  <text x="450" y="400" class="text">OpenSSL &amp; appgw_ekv.so</text>
  <text x="450" y="415" class="text">PKCS#11 Interface</text>
  
  <!-- Backend Servers -->
  <rect x="580" y="370" width="180" height="90" class="azure-component-box"/>
  <text x="670" y="395" class="title">Backend Servers</text>
  <text x="670" y="415" class="text">Web Applications</text>
  <text x="670" y="430" class="text">Azure Container Apps</text>
  <text x="670" y="445" class="text">Microservices</text>
  
  <!-- Connection Arrows -->
  
  <!-- Client to Internet Arrow -->
  <line x1="150" y1="115" x2="230" y2="115" class="arrow"/>
  
  <!-- TLS Handshake text underneath Internet -->
  <text x="300" y="165" class="text">1. TLS Handshake</text>
  
  <!-- Internet to App Gateway Arrow -->
  <line x1="370" y1="115" x2="450" y2="115" class="arrow"/>
  
  <!-- App Gateway to Managed HSM (Curved Connection) -->
  <line x1="520" y1="200" x2="200" y2="320" class="secure-arrow"/>
  <text x="320" y="240" class="text" fill="#008000">2. Identity Auth &amp;</text>
  <text x="320" y="255" class="text" fill="#008000">3. Crypto Operations</text>
  
  <!-- App Gateway to Backend (Vertical Connection) -->
  <line x1="650" y1="200" x2="650" y2="370" class="arrow"/>
  <text x="670" y="285" class="text">4. TLS Re-encryption</text>
  
  <!-- Linux VM to Managed HSM (CSR Generation) -->
  <line x1="380" y1="385" x2="270" y2="385" class="cert-arrow"/>
  <text x="325" y="405" class="text" fill="#0066cc">CSR Generation</text>
  
  <!-- Linux VM to Application Gateway (Supply Public Cert) -->
  <line x1="480" y1="340" x2="550" y2="200" class="cert-arrow"/>
  <text x="490" y="260" class="text" fill="#0066cc">Supply Public Cert</text>
  
  <!-- Legend -->
  <rect x="330" y="480" width="140" height="90" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
  <text x="400" y="500" class="title">Legend</text>
  <line x1="345" y1="515" x2="365" y2="515" class="legend-arrow"/>
  <text x="400" y="520" class="text" fill="#333">Standard Flow</text>
  <line x1="345" y1="535" x2="365" y2="535" class="legend-secure-arrow"/>
  <text x="400" y="540" class="text" fill="#008000">Secure/Auth</text>
  <line x1="345" y1="555" x2="365" y2="555" class="legend-cert-arrow"/>
  <text x="400" y="560" class="text" fill="#0066cc">Cert/CSR</text>
  
</svg>